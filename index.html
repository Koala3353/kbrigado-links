<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Keene Brigado | Links</title>
    <meta name="description" content="Résumé, portfolio, and contact links for Keene Xander Brigado, Management Engineering student at Ateneo de Manila University working across code, operations, and AI." />
    <meta name="theme-color" content="#f4f4f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/kbrigado-links/favicon.svg" />
    <link rel="apple-touch-icon" href="/kbrigado-links/avatar.jpg" />

    <meta property="og:type" content="profile" />
    <meta property="og:title" content="Keene Brigado | Links" />
    <meta property="og:description" content="Résumé, portfolio, and contact links in one place." />
    <meta property="og:url" content="https://koala3353.github.io/kbrigado-links/" />
    <meta property="og:image" content="https://koala3353.github.io/kbrigado-links/avatar.jpg" />
    <meta name="twitter:card" content="summary" />

    <script>
      // Resolve the theme before first paint so there is no flash.
      (function () {
        try {
          var pref = localStorage.getItem('theme') || 'system';
          var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
